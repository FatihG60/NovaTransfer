# ==============================================================================
# Nginx Konfigürasyonu - Sınırsız Dosya Boyutu + TUS Streaming + CORS
# Dosya Yolu: /etc/nginx/sites-available/filebrowser.conf
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.alanadiniz.com;

    # SSL Sertifikalarınız (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/files.alanadiniz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.alanadiniz.com/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;

    # KRİTİK AYAR 1: Dosya boyutu sınırını tamamen kaldır (0 = Sınırsız)
    client_max_body_size 0;

    # KRİTİK AYAR 2: Parçaları Nginx diskinde bekletmeden doğrudan FileBrowser'a akıt
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Büyük dosya SHA-512 doğrulaması için zaman aşımı süreleri
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;

    location / {
        # CORS Preflight (OPTIONS) Yanıtı
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, X-Auth, Content-Type, Tus-Resumable, Upload-Length, Upload-Offset, Upload-Metadata, Upload-Checksum' always;
            add_header 'Access-Control-Expose-Headers' 'Upload-Offset, Upload-Length, Location, Tus-Resumable' always;
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Upload-Offset, Upload-Length, Location, Tus-Resumable' always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:8080;
    }
}
